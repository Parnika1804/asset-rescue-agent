[global]
showWarningOnDirectExecution = false

[server]
headless = true

[client]
toolbarMode = "minimal"

[theme]
primaryColor             = "#0EA5E9"   # sky-500 — vivid sky blue, buttons & accents
backgroundColor          = "#FFFFFF"   # pure white page background
secondaryBackgroundColor = "#F0F9FF"   # sky-50 — barely-blue tint for sidebar & cards
textColor                = "#0F172A"   # slate-900 — strong contrast, not pure black
font                     = "sans serif"
